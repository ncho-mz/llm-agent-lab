# 로컬 CPU 드라이런(비용 $0): 아래 값 그대로 사용
# GPU 인스턴스(g4dn.xlarge/g5.xlarge)에서 진짜로 돌릴 때: base_model을 Qwen/Qwen3-8B로 바꾸고 load_in_4bit: true

base_model: Qwen/Qwen3-0.6B
load_in_4bit: false
max_new_tokens: 256

# --character 옵션 없이 스크립트를 실행하면 이 캐릭터를 씀. characters/<name>/ 폴더로 정의됨.
active_character: odysseus

embedding_model: sentence-transformers/all-MiniLM-L6-v2
top_k: 3
